{{- $target := "dicom-volume" -}}
{{- range slice
  "style.css"
  "viewer.js"
  "slices.js"
  "volume-shader.js"
  "volume.bin"
  "volume.json"
-}}
  {{- $asset := resources.Get (path.Join $target .) -}}
  {{- $asset.Publish -}}
{{- end -}}
{{- $entry := resources.Get (path.Join $target "index.html") -}}

<iframe
  src="{{ $entry.RelPermalink }}"
  title="Interactive MR volume"
  loading="lazy"
  style="display:block;width:100%;height:840px;border:0">
</iframe>
<script>
  (() => {
    const frame = document.currentScript.previousElementSibling;
    frame.addEventListener("load", () => {
      const viewer = frame.contentDocument.querySelector("main");
      if (!viewer) return;
      frame.contentDocument.documentElement.classList.add("embedded");
      const fit = () => {
        frame.style.height = Math.ceil(viewer.getBoundingClientRect().height) + "px";
      };
      new ResizeObserver(fit).observe(viewer);
      fit();
    });
  })();
</script>
